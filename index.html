<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(1000px 500px at 85% -10%,rgba(232,56,13,.25),transparent 60%),#0b0b0b;color:#f4f4f4;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;display:flex;flex-direction:column}
.wrap{max-width:900px;width:100%;margin:0 auto;padding:40px 22px;flex:1}header{display:flex;align-items:center;gap:18px;margin-bottom:8px}header img{height:46px}
h1{margin:0;font-size:22px;letter-spacing:3px;font-weight:800}h1 span{color:#f04010}.sub{color:#8d8d8d;font-size:13px;letter-spacing:2px;margin-top:4px}
.bar{height:3px;background:linear-gradient(90deg,#f04010,transparent);border-radius:2px;margin:22px 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
a.card{display:block;text-decoration:none;color:inherit;background:#151515;border:1px solid #262626;border-radius:18px;padding:22px;transition:transform .1s,border-color .15s}
a.card:hover,a.card:active{transform:translateY(-2px);border-color:#f04010}.ic{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#f04010,#b81d0a);display:grid;place-items:center;margin-bottom:16px;box-shadow:0 8px 22px rgba(232,56,13,.35)}
.ic svg{width:28px;height:28px;color:#fff}.card h2{margin:0 0 6px;font-size:18px;letter-spacing:1.5px}.card p{margin:0;color:#9a9a9a;font-size:14px;line-height:1.4}
footer{text-align:center;color:#666;font-size:12px;letter-spacing:1px;padding:20px}footer b{color:#aaa}</style></head><body><div class="wrap">
